[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
; 这些目录都在 res:// 之内，但不属于**运行时**资源。默认的 all_resources 会把它们一起扫进来：
;   build/*        上一轮导出产物；一次 --import 会在 build/web/ 里生成 .import 旁挂文件，
;                  下一次导出就把它们连同 png 一起塞进 index.pck（PET-57 实测 +24KB 且逐轮增长）
;   .godot/*       本地导入缓存（global_script_class_cache.cfg / uid_cache.bin / imported/*.ctex）
;   tools/*        tools/godot/editor_data 下的**用户既有编辑器设置**（*.tres / *.res）
;   tests/*        测试脚本与 .gd.remap；永不参与游戏运行
;   docs/*         规范文档（.md 本就不是资源，排除是为了把「哪些目录属于运行时不变量」写死）
;   assets/_review/*  07_ASSET_PIPELINE 的送审暂存区，不是已批准素材
exclude_filter="build/*, .godot/*, tools/*, tests/*, docs/*, assets/_review/*"
export_path="build/web/index.html"

[preset.0.options]

variant/thread_support=true

[preset.1]

; PET-74：Windows 调试包。给用户一个双击就能跑的产物，无需编辑器 / 命令行。
; debug 即可（L1 验收只要求「双击 → BOOT → 主菜单 → 开始整备 → PREPARATION」）。
; 产物落 build/windows/ —— build/** 已 gitignore，且在 01 §11.3 中联接到 E:，不占 D:。
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; 与 Web 预设同一份排除理由，见上方注释。
exclude_filter="build/*, .godot/*, tools/*, tests/*, docs/*, assets/_review/*"
export_path="build/windows/PixelFusion.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
; 1 = 额外产出 PixelFusion.console.exe，方便看 stdout；双击 PixelFusion.exe 本身仍无控制台窗口。
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
; false：跳过 rcedit（本项目未配置 export/windows/rcedit），避免导出时因缺工具告警。
; 代价是 exe 无自定义图标 / 版本信息 —— 本卡不要求，也不改 project.godot。
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="PixelFusion"
application/product_name="PixelFusion"
application/file_description="PixelFusion"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
