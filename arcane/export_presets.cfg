[preset.0]

; 从旧工程原样带走的两个预设（PET-85 允许清单：Windows + Web）。改的只有产物名与排除项：
; 旧工程的 docs/ 与 assets/_review/ 不在新工程里，留着是死规则。
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
; 这些目录都在 res:// 之内，但不属于**运行时**资源。默认的 all_resources 会把它们一起扫进来：
;   build/*        上一轮导出产物；一次 --import 会在 build/web/ 里生成 .import 旁挂文件，
;                  下一次导出就把它们连同 png 一起塞进 index.pck（PET-57 实测 +24KB 且逐轮增长）
;   .godot/*       本地导入缓存（global_script_class_cache.cfg / uid_cache.bin / imported/*.ctex）
;   tools/*        tools/ 下是截图等开发期脚本，永不参与游戏运行
;   tests/*        测试脚本与 .gd.remap；永不参与游戏运行
exclude_filter="build/*, .godot/*, tools/*, tests/*"
export_path="build/web/index.html"

[preset.0.options]

; PET-94：由 true 改为 false。开启线程的 Web 产物**必须**由带 COOP/COEP 响应头的服务端下发
; （Godot 的 index.html 会检查 crossOriginIsolated，不满足时直接报错停住），
; 而本卡要求「Web 包要能直接开（本地静态服务即可）」—— `python -m http.server` 之类的
; 普通静态服务不发这两个头。关掉线程后产物不依赖 SharedArrayBuffer，任何静态服务都能直接打开。
; 代价：单线程，重负载下的音频/性能不如线程版（本作是 2D 卡牌，实测够用）。
; 若将来要换回线程版：把这里改回 true，并且**必须**换用带 COOP/COEP 的服务方式。
variant/thread_support=false

[preset.1]

; 双击即跑的 Windows 调试包。产物落 build/windows/ —— build/** 已 gitignore。
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; 与 Web 预设同一份排除理由，见上方注释。
exclude_filter="build/*, .godot/*, tools/*, tests/*"
export_path="build/windows/ArcaneBlueprint.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
; 1 = 额外产出 ArcaneBlueprint.console.exe，方便看 stdout；双击 .exe 本身仍无控制台窗口。
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
; false：跳过 rcedit（本工程未配置 export/windows/rcedit），避免导出时因缺工具告警。
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="ArcaneBlueprint"
application/product_name="ArcaneBlueprint"
application/file_description="Arcane Blueprint"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
